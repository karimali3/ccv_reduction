<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/filepond@4.31.1/dist/filepond.min.css">
        <link rel="stylesheet" href="style.css">
        <title>Convert CCV Export to minimized version</title>
        <style>
            html, body {
                height: 100%;
                margin: 0;
                background: white;
                color: black;
            }
            #save-pdf {
                margin: 0.5rem;
                padding: 0.5rem 0.75rem;
                background: #60a5fa;
                color: white;
                border: 0;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="m-auto p-8 w-full h-1/6 columns-1 border">
            <div>
                <input type="file" class="filepond" name="ccv">
            </div>
        </div>

        <div class="m-auto p-2 w-full h-5/6" id="preview">
            <div class="hidden text-center" id="processing">
                <span>Processing XML...</span>
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><style>.spinner_P7sC{transform-origin:center;animation:spinner_svv2 .75s infinite linear}@keyframes spinner_svv2{100%{transform:rotate(360deg)}}</style><path d="M10.14,1.16a11,11,0,0,0-9,8.92A1.59,1.59,0,0,0,2.46,12,1.52,1.52,0,0,0,4.11,10.7a8,8,0,0,1,6.66-6.61A1.42,1.42,0,0,0,12,2.69h0A1.57,1.57,0,0,0,10.14,1.16Z" class="spinner_P7sC"/></svg>
            </div>
            <p class="w-full hidden" id="msg"></p>
            <button type="button" id="save-pdf" class="hidden">Save as PDF</button>
            <iframe id="preview-frame" class="w-full h-5/6 hidden" title="CV preview"></iframe>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.12/build/pdfmake.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.12/build/vfs_fonts.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/html-to-pdfmake@2.5.13/browser.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/nunjucks@3.2.4/browser/nunjucks.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/filepond@4.31.1/dist/filepond.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/filepond-plugin-file-validate-type@1.2.9/dist/filepond-plugin-file-validate-type.min.js"></script>
        <script src="convert.js"></script>
        <script>
            var templatePromise = fetch("cv_tmpl.html").then(function (response) {
                if (!response.ok) throw new Error("Could not load the CV template.");
                return response.text();
            });
            var pdfFilename = "cv.pdf";

            function showMessage(text) {
                var msg = document.querySelector("#msg");
                msg.textContent = text;
                msg.classList.remove("hidden");
            }

            function resetPreview() {
                document.querySelector("#msg").classList.add("hidden");
                document.querySelector("#save-pdf").classList.add("hidden");
                document.querySelector("#preview-frame").classList.add("hidden");
            }

            FilePond.registerPlugin(FilePondPluginFileValidateType);
            var pond = FilePond.create(document.querySelector("input"), {
                instantUpload: false,
                allowMultiple: false,
                acceptedFileTypes: ["application/xml", "text/xml"],
                labelIdle: 'Drag & Drop CCV XML export or <span class="filepond--label-action">Browse</span>'
            });

            pond.on("addfile", function (error, item) {
                if (error) {
                    showMessage(error.body || "Could not read that file.");
                    return;
                }
                document.querySelector("#processing").classList.remove("hidden");
                resetPreview();
                var reader = new FileReader();
                reader.onload = function () {
                    templatePromise.then(function (template) {
                        var data = CcvConvert.convertCcv(reader.result);
                        var html = CcvConvert.withPrintCss(CcvConvert.renderCv(nunjucks, template, data));
                        var frame = document.querySelector("#preview-frame");
                        frame.srcdoc = html;
                        frame.classList.remove("hidden");
                        pdfFilename = item.file.name.replace(/\.xml$/i, "") + ".pdf";
                        document.querySelector("#save-pdf").classList.remove("hidden");
                    }).catch(function (err) {
                        showMessage(err && err.message ? err.message : "Could not convert that file.");
                    }).finally(function () {
                        document.querySelector("#processing").classList.add("hidden");
                    });
                };
                reader.onerror = function () {
                    document.querySelector("#processing").classList.add("hidden");
                    showMessage("Could not read that file.");
                };
                reader.readAsText(item.file);
            });

            function isBlankBlock(item) {
                return !!item && (item.nodeName === "BR" || (typeof item.text === "string" && item.text.trim() === "" && !item.table));
            }

            function tunePdfList(items, dropBreaks) {
                for (var i = items.length - 1; i >= 0; i--) {
                    if (dropBreaks && isBlankBlock(items[i])) items.splice(i, 1);
                    else tunePdfNodes(items[i]);
                }
            }

            function tunePdfNodes(node) {
                if (!node) return;
                if (Array.isArray(node)) {
                    tunePdfList(node, true);
                    return;
                }
                if (typeof node !== "object") return;
                if (node.table && node.table.body && node.table.body.length) {
                    node.layout = "noBorders";
                    var columns = node.table.body[0].length;
                    node.table.widths = [];
                    for (var i = 0; i < columns; i++) {
                        node.table.widths.push(i === 0 && columns > 1 ? "auto" : "*");
                    }
                    node.table.body.forEach(function (row) {
                        row.forEach(tunePdfNodes);
                    });
                }
                if (Array.isArray(node.stack)) tunePdfList(node.stack, true);
                if (Array.isArray(node.ul)) tunePdfList(node.ul, true);
                if (Array.isArray(node.ol)) tunePdfList(node.ol, true);
                if (Array.isArray(node.text)) tunePdfList(node.text, false);
            }

            function downloadBlob(blob, filename) {
                var url = URL.createObjectURL(blob);
                var link = document.createElement("a");
                link.href = url;
                link.download = filename;
                link.click();
                URL.revokeObjectURL(url);
            }

            document.querySelector("#save-pdf").addEventListener("click", function () {
                var frame = document.querySelector("#preview-frame");
                var button = document.querySelector("#save-pdf");
                if (!frame.contentDocument || !frame.contentDocument.body || button.disabled) return;
                button.disabled = true;
                button.textContent = "Saving PDF...";
                try {
                    var content = htmlToPdfmake(frame.contentDocument.body.innerHTML, {
                        window: frame.contentWindow,
                        removeExtraBlanks: true,
                        defaultStyles: {
                            h1: { fontSize: 16, bold: true, color: "#008b8b", margin: [0, 9, 0, 5], marginBottom: "" },
                            h2: { fontSize: 12, bold: true, color: "#000000", margin: [0, 8, 0, 4], marginBottom: "" },
                            h3: { fontSize: 9, bold: true, color: "#000000", margin: [0, 7, 0, 3], marginBottom: "" },
                            td: { margin: [0, 1, 10, 2] },
                            table: { margin: [0, 1, 0, 5] }
                        }
                    });
                    tunePdfNodes(content);
                    pdfMake.createPdf({
                        pageSize: "LETTER",
                        pageMargins: [36, 36, 36, 36],
                        defaultStyle: { fontSize: 8 },
                        content: content
                    }).getBlob(function (blob) {
                        downloadBlob(blob, pdfFilename);
                        button.disabled = false;
                        button.textContent = "Save as PDF";
                    });
                } catch (err) {
                    button.disabled = false;
                    button.textContent = "Save as PDF";
                    showMessage(err && err.message ? err.message : "Could not create the PDF.");
                }
            });
        </script>
    </body>
</html>
